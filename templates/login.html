{% extends "base.html" %}
{% block content %}
<style>
    /* --- Existing Animations --- */
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float-blob {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
    }
    
    /* --- New Eye Pop Animation --- */
    @keyframes eyePop {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .blob {
        position: absolute; width: 300px; height: 300px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
        filter: blur(60px); border-radius: 50%; z-index: -1;
        animation: float-blob 10s infinite alternate;
    }

    .glass-login {
        background: var(--glass-bg); backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
        border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    }

    .input-group { position: relative; margin-bottom: 24px; }

    .glass-input {
        width: 100%; background: rgba(255, 255, 255, 0.05);
        border: 2px solid var(--glass-border); border-radius: 16px;
        padding: 14px 48px 14px 48px;
        color: var(--text-main); transition: all 0.3s ease; font-weight: 500;
    }

    /* Fixed placeholder color for visibility */
    .glass-input::placeholder { color: var(--text-muted); opacity: 0.6; }

    .glass-input:focus {
        border-color: #6366f1; background: rgba(255, 255, 255, 0.1);
        outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .input-icon {
        position: absolute; left: 16px; top: 50%;
        transform: translateY(-50%); color: var(--text-muted);
        transition: color 0.3s ease; pointer-events: none;
    }

    .eye-toggle {
        position: absolute; right: 16px; top: 50%;
        transform: translateY(-50%); color: var(--text-muted);
        background: none; border: none; cursor: pointer;
        padding: 0; display: flex; align-items: center;
        transition: color 0.3s ease;
    }

    .eye-toggle:hover { color: #6366f1; }
    .eye-toggle.clicked svg { animation: eyePop 0.3s ease-out; }

    .glass-input:focus ~ .input-icon { color: #6366f1; }

    .btn-shiny {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        color: white; font-weight: 700; letter-spacing: 0.5px;
        padding: 14px; border-radius: 16px; width: 100%; border: none;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        cursor: pointer;
    }

    .btn-shiny:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
    }
</style>
<div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="blob" style="top: -5%; left: -5%; width: 50vw; height: 50vw;"></div>
    <div class="blob" style="bottom: -5%; right: -5%; width: 50vw; height: 50vw; animation-delay: -5s; background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(99, 102, 241, 0.2) 100%);"></div>
</div>
<div class="relative min-h-[90vh] flex items-center justify-center overflow-hidden px-4">
    <div class="glass-login w-full max-w-[440px] p-8 md:p-12 animate-slide-up">
        <div class="text-center mb-10">
            <div class="inline-flex p-4 rounded-2xl bg-indigo-500/10 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-3xl font-black mb-2 tracking-tight" style="color: var(--text-main);">Welcome Back</h1>
            <p class="font-medium" style="color: var(--text-muted);">Please enter your details to login</p>
        </div>

        <form method="POST" class="space-y-4">
            <div class="input-group">
                <input type="text" name="username" class="glass-input" placeholder="Username" required>
                <div class="input-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
            </div>

            <div class="input-group">
                <input type="password" name="password" id="loginPassword" class="glass-input" placeholder="Password" required>
                <div class="input-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <button type="button" class="eye-toggle" onclick="togglePasswordVisibility()">
                    <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-shiny">
                Login to Dashboard
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="font-medium" style="color: var(--text-muted);">
                Don't have an account? 
                <a href="{{ url_for('register') }}" class="text-indigo-500 font-bold hover:underline decoration-2 underline-offset-4">Register here</a>
            </p>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('loginPassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeButton = eyeIcon.parentElement;

        eyeButton.classList.add('clicked');
        setTimeout(() => eyeButton.classList.remove('clicked'), 300);

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            `;
        } else {
            passwordInput.type = 'password';
            eyeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
        }
    }
</script>
{% endblock %}
