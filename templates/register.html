{% extends "base.html" %}
{% block content %}
<style>
    /* --- Animations --- */
    @keyframes slideRight {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes eyePop {
        0% { transform: scale(1); }
        50% { transform: scale(1.3) rotate(15deg); }
        100% { transform: scale(1); }
    }

    .animate-slide-right { animation: slideRight 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* --- Glass Container --- */
    .glass-register {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    }

    /* --- Form Controls --- */
    .input-group {
        position: relative;
        margin-bottom: 20px;
    }
    
    /* Fixed placeholder visibility */
    .glass-input::placeholder {
        color: var(--text-muted);
        opacity: 0.6;
    }

    .glass-input {
        width: 100%;
        background: var(--input-bg);;
        border: 2px solid var(--glass-border);
        border-radius: 16px;
        padding: 14px 48px;
        color: var(--text-main);
        transition: all 0.3s ease;
        font-weight: 500;
        appearance: none;
    }

    .glass-input:focus {
        border-color: #10b981; /* Emerald theme for Registration */
        background: rgba(255, 255, 255, 0.1);
        outline: none;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
    }

    .input-left-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
    }

    .glass-input:focus ~ .input-left-icon {
        color: #10b981;
    }

    /* --- Eye Button Animation --- */
    .eye-btn {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--text-muted);
        transition: color 0.3s ease;
        border: none;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .eye-btn:hover { color: #10b981; }
    .eye-btn.active { animation: eyePop 0.4s ease; color: #10b981; }

    /* --- Submit Button --- */
    .btn-register {
        background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
        color: white;
        font-weight: 700;
        padding: 14px;
        border-radius: 16px;
        width: 100%;
        border: none;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
    }

    .btn-register:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.6);
    }
</style>
<div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute top-0 -left-20 w-[600px] h-[600px] bg-emerald-400/20 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-0 -right-20 w-[600px] h-[600px] bg-blue-400/20 blur-[120px] rounded-full"></div>
</div>
<div class="relative min-h-[90vh] flex items-center justify-center px-4 overflow-hidden">
    <div class="glass-register w-full max-w-[460px] p-8 md:p-12 animate-slide-right">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black mb-2 tracking-tight" style="color: var(--text-main);">Create Account</h1>
            <p class="font-medium" style="color: var(--text-muted);">Join the family and start tracking</p>
        </div>

        <form method="POST" id="registerForm" class="space-y-2">
            <div class="input-group">
                <div class="input-left-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <input type="text" name="username" class="glass-input" placeholder="Choose a Username" required>
            </div>

            <div class="input-group">
                <div class="input-left-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <input type="password" name="password" id="password" class="glass-input" placeholder="Create Password" required>
                <button type="button" class="eye-btn" onclick="togglePass('password', this)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eye-icon-password"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
            </div>

            <div class="input-group">
                <div class="input-left-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </div>
                <input type="password" name="confirm_password" id="confirm_password" class="glass-input" placeholder="Confirm Password" required>
                <button type="button" class="eye-btn" onclick="togglePass('confirm_password', this)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
            </div>

            <div class="py-4">
                <button type="submit" class="btn-register">
                    Create My Account
                </button>
            </div>
        </form>

        <div class="text-center mt-6">
            <p class="font-medium" style="color: var(--text-muted);">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="text-emerald-500 font-bold hover:underline underline-offset-4">Login here</a>
            </p>
        </div>
    </div>
</div>

<script>
    function togglePass(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('svg');
        
        btn.classList.remove('active');
        void btn.offsetWidth; 
        btn.classList.add('active');

        if (input.type === "password") {
            input.type = "text";
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />';
        } else {
            input.type = "password";
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
        }
    }

    document.getElementById('registerForm').onsubmit = function(e) {
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        if (pass !== confirm) {
            alert("Passwords do not match!");
            e.preventDefault();
        }
    };
</script>
{% endblock %}
